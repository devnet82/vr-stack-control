name: Temporary CachyOS VM capability probe
on:
  push:
    branches:
      - qa/cachyos-vm-probe-20261010
permissions:
  contents: read
jobs:
  vm-prerequisites:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Inspect runner and download dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER=$(uname -s -m)"
          python3 --version
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils python3-venv xvfb openbox dbus-x11 libegl1 libgl1 libopengl0 libxkbcommon0 libxcb-cursor0
          python3 -m venv /tmp/devnet-qa-venv
          /tmp/devnet-qa-venv/bin/python -m pip install --disable-pip-version-check --quiet PySide6
          /tmp/devnet-qa-venv/bin/python -c "from PySide6.QtWidgets import QApplication, QLabel; app=QApplication([]); print('PYSIDE6_OK', app.platformName())" 
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Verify emulator and desktop prerequisites
        shell: bash
        run: |
          set -euo pipefail
          qemu-system-x86_64 --version | head -1
          qemu-img --version | head -1
          test -c /dev/kvm && echo 'KVM_AVAILABLE=yes' || echo 'KVM_AVAILABLE=no; TCG can still emulate'
          xvfb-run -a bash -c 'command -v openbox && command -v dbus-run-session && echo VIRTUAL_DESKTOP_READY=yes'
          echo "GITHUB_HOSTED_VM_PREREQUISITES_PASS"
