name: Devnet Unified Master QA — GitHub first
on:
  push:
    branches: [qa/master-unified-v0.2.4-github-first]
    paths:
      - 'qa/master/devnet-master-qa-unified-v0.2.4-QA-BLOCKED.zip'
      - '.github/workflows/devnet-master-qa-github-first.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
      - name: Validate exact package and run full bundled suite
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, subprocess, sys, tempfile, zipfile
          expected = '65eeee33e11531b854882121a08bc702390d5bbd5d37c14784d5c81eec471110'
          package = pathlib.Path('qa/master/devnet-master-qa-unified-v0.2.4-QA-BLOCKED.zip')
          assert package.is_file(), 'BLOCKED: expected exact candidate ZIP missing'
          actual = hashlib.sha256(package.read_bytes()).hexdigest()
          assert actual == expected, f'BLOCKED: package digest mismatch {actual}'
          with zipfile.ZipFile(package) as z, tempfile.TemporaryDirectory() as tmp:
              bad = z.testzip()
              assert bad is None, f'BLOCKED: bad archive member {bad}'
              members = [x for x in z.infolist() if not x.is_dir()]
              assert len(members) == 6, 'BLOCKED: unexpected number of package files'
              root = pathlib.Path(tmp)
              for info in members:
                  target = (root / info.filename).resolve()
                  assert target.is_relative_to(root.resolve()), 'BLOCKED: zip traversal'
                  assert not info.filename.startswith('/'), 'BLOCKED: absolute path'
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(info))
              sub = root / 'devnet-master-qa-unified-v0.2.4-QA-BLOCKED'
              pyfiles = [sub / 'devnet-qa-automation/controller.py', sub / 'devnet-qa-automation/agent.py', sub / 'devnet-qa-verified.py', sub / 'test_master_gate.py']
              for f in pyfiles:
                  assert f.is_file(), f'BLOCKED: missing {f.name}'
                  compile(f.read_bytes(), str(f), 'exec')
              p = subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', str(sub), '-p', 'test_master_gate.py', '-v'], cwd=sub)
              print(f'GH_UNITTEST_EXIT={p.returncode}', flush=True)
              sys.exit(p.returncode)
          PY
      - name: Record result
        if: always()
        run: |
          echo 'Full Master QA remains BLOCKED until VM, host and trusted execution evidence pass.' >> "$GITHUB_STEP_SUMMARY"
