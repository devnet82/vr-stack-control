name: Devnet Unified Master QA — GitHub first
on:
  push:
    branches: [qa/master-unified-v0.2.4-github-first]
    paths:
      - 'qa/master/devnet-master-qa-unified-v0.3.6-QA-BLOCKED.zip'
      - '.github/workflows/devnet-master-qa-github-first.yml'
      - 'qa/master/MASTER_QA_WEB_RESEARCH_REQUIREMENT.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
      - name: Enforce mandatory web-research policy presence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          policy=Path('qa/master/MASTER_QA_WEB_RESEARCH_REQUIREMENT.md')
          assert policy.is_file(), 'BLOCKED: missing Master QA online-research requirement'
          text=policy.read_text(encoding='utf-8')
          for item in ('BEFORE attempting a repair','exact installed versions',
                       'source names and URLs','WEB_RESEARCH_BLOCKED',
                       '100% of all applicable QA','release_approved=false',
                       'untrusted','not an executed tool call'):
              assert item in text, 'BLOCKED: research policy incomplete: '+item
          print('MASTER_QA_WEB_RESEARCH_POLICY: PRESENT_AND_REQUIRED')
          PY
      - name: Validate exact package and run full bundled suite
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, subprocess, sys, tempfile, zipfile
          expected = '658fa2dd61f4e63803f43ed0abfb8960e8fd79628d1587d84a08b0f4e7338eed'
          package = pathlib.Path('qa/master/devnet-master-qa-unified-v0.3.6-QA-BLOCKED.zip')
          assert package.is_file(), 'BLOCKED: expected exact candidate ZIP missing'
          actual = hashlib.sha256(package.read_bytes()).hexdigest()
          assert actual == expected, f'BLOCKED: package digest mismatch {actual}'
          with zipfile.ZipFile(package) as z, tempfile.TemporaryDirectory() as tmp:
              bad = z.testzip()
              assert bad is None, f'BLOCKED: bad archive member {bad}'
              members = [x for x in z.infolist() if not x.is_dir()]
              assert len(members) == 19, 'BLOCKED: unexpected number of package files'
              root = pathlib.Path(tmp)
              for info in members:
                  target = (root / info.filename).resolve()
                  assert target.is_relative_to(root.resolve()), 'BLOCKED: zip traversal'
                  assert not info.filename.startswith('/'), 'BLOCKED: absolute path'
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(info))
              sub = root / 'devnet-master-qa-unified-v0.3.6-QA-BLOCKED'
              pyfiles = sorted(sub.rglob('*.py'))
              assert len(pyfiles) == 17, 'BLOCKED: unexpected Python file count'
              for f in pyfiles:
                  assert f.is_file(), f'BLOCKED: missing {f.name}'
                  compile(f.read_bytes(), str(f), 'exec')
              p = subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', str(sub), '-p', 'test_*.py', '-v'], cwd=sub)
              print(f'GH_UNITTEST_EXIT={p.returncode}', flush=True)
              sys.exit(p.returncode)
          PY
      - name: Record result
        if: always()
        run: |
          echo 'Full Master QA remains BLOCKED until VM, host and trusted execution evidence pass.' >> "$GITHUB_STEP_SUMMARY"
