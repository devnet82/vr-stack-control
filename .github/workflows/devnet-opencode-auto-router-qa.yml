name: Devnet OpenCode Auto-Router QA — GitHub first
on:
  push:
    branches: [qa/master-unified-v0.2.4-github-first]
    paths:
      - 'qa/router/devnet-opencode-auto-router-v0.1.8-QA-BLOCKED.zip'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-router-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact ZIP and full 119-test regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, subprocess, sys, tempfile, zipfile
          file = pathlib.Path('qa/router/devnet-opencode-auto-router-v0.1.8-QA-BLOCKED.zip')
          expected = 'e6c5dc33bc9920079f90d3ad3d6df324e6bdbdd6e07d1925aee59f634b38df3d'
          assert file.is_file(), 'BLOCKED: exact router candidate missing'
          assert hashlib.sha256(file.read_bytes()).hexdigest() == expected, 'BLOCKED: ZIP SHA256 mismatch'
          with zipfile.ZipFile(file) as z, tempfile.TemporaryDirectory() as tmp:
              assert z.testzip() is None, 'BLOCKED: ZIP CRC failure'
              members = [x for x in z.infolist() if not x.is_dir()]
              expected_files = {
                  'devnet-opencode-auto-router-v0.1.8-QA-BLOCKED/README.md',
                  'devnet-opencode-auto-router-v0.1.8-QA-BLOCKED/auto_route.py',
                  'devnet-opencode-auto-router-v0.1.8-QA-BLOCKED/baseline_v017.zip',
                  'devnet-opencode-auto-router-v0.1.8-QA-BLOCKED/opencode.json',
                  'devnet-opencode-auto-router-v0.1.8-QA-BLOCKED/qa_dispatch.py',
                  'devnet-opencode-auto-router-v0.1.8-QA-BLOCKED/qa_live_recovery_v017.py',
                  'devnet-opencode-auto-router-v0.1.8-QA-BLOCKED/qa_review_worker.py',
                  'devnet-opencode-auto-router-v0.1.8-QA-BLOCKED/test_auto_handover.py',
                  'devnet-opencode-auto-router-v0.1.8-QA-BLOCKED/test_auto_route.py',
                  'devnet-opencode-auto-router-v0.1.8-QA-BLOCKED/test_qa_dispatch.py',
                  'devnet-opencode-auto-router-v0.1.8-QA-BLOCKED/test_session_recovery.py',
                  'devnet-opencode-auto-router-v0.1.8-QA-BLOCKED/.opencode/tools/devnet_qa.ts',
              }
              assert {x.filename for x in members} == expected_files, 'BLOCKED: unexpected ZIP contents'
              root = pathlib.Path(tmp).resolve()
              for item in members:
                  path = (root/item.filename).resolve()
                  assert path.is_relative_to(root) and not item.filename.startswith('/'), 'BLOCKED: ZIP traversal'
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(z.read(item))
              source = root/'devnet-opencode-auto-router-v0.1.8-QA-BLOCKED'
              assert hashlib.sha256((source/'baseline_v017.zip').read_bytes()).hexdigest() == '8a72d480d403c1ecab29a4348a500b9c713a93808f97be94facba270c75d41db', 'BLOCKED: pinned baseline changed'
              assert hashlib.sha256((source/'qa_live_recovery_v017.py').read_bytes()).hexdigest() == 'd020f62b9a86d0a3547f82dcdbc3a77d7182300ce3aaf838136acfdf0783b1ee', 'BLOCKED: pinned live runner changed'
              for f in source.glob('*.py'): compile(f.read_bytes(), str(f), 'exec')
              assert len(list(source.glob('*.py'))) == 8, 'BLOCKED: unexpected Python module count'
              p = subprocess.run([sys.executable,'-m','unittest','discover','-s',str(source),'-p','test_*.py','-v'],cwd=source,check=False)
              print('GITHUB_ROUTER_TEST_EXIT='+str(p.returncode),flush=True)
              sys.exit(p.returncode)
          PY
      - name: Report fail-closed scope
        if: always()
        run: echo 'GitHub Python regression only. Full Master QA, VM, host, live OpenCode/Ollama/GPU, install/rollback and acceptance remain BLOCKED.' >> "$GITHUB_STEP_SUMMARY"
