name: Devnet OpenCode Auto-Router QA — GitHub first
on:
  push:
    branches: [qa/master-unified-v0.2.4-github-first]
    paths:
      - 'qa/router/devnet-opencode-auto-router-v0.2.4-QA-BLOCKED.zip'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  validate-router-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact ZIP and full 221-test regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys, tempfile, zipfile
          file = pathlib.Path('qa/router/devnet-opencode-auto-router-v0.2.4-QA-BLOCKED.zip')
          expected = '8606216572d244cd222892d4ca91eaa6be8496db6053495b4bc2b4575f5d913a'
          assert file.is_file(), 'BLOCKED: exact router candidate missing'
          assert hashlib.sha256(file.read_bytes()).hexdigest() == expected, 'BLOCKED: ZIP SHA256 mismatch'
          with zipfile.ZipFile(file) as z, tempfile.TemporaryDirectory() as tmp:
              assert z.testzip() is None, 'BLOCKED: ZIP CRC failure'
              members = [x for x in z.infolist() if not x.is_dir()]
              expected_files = {
                  'devnet-opencode-auto-router-v0.2.4-QA-BLOCKED/README.md',
                  'devnet-opencode-auto-router-v0.2.4-QA-BLOCKED/auto_route.py',
                  'devnet-opencode-auto-router-v0.2.4-QA-BLOCKED/baseline_v017.zip',
                  'devnet-opencode-auto-router-v0.2.4-QA-BLOCKED/opencode.json',
                  'devnet-opencode-auto-router-v0.2.4-QA-BLOCKED/qa_dispatch.py',
                  'devnet-opencode-auto-router-v0.2.4-QA-BLOCKED/qa_live_recovery_v017.py',
                  'devnet-opencode-auto-router-v0.2.4-QA-BLOCKED/qa_review_worker.py',
                  'devnet-opencode-auto-router-v0.2.4-QA-BLOCKED/test_auto_handover.py',
                  'devnet-opencode-auto-router-v0.2.4-QA-BLOCKED/test_auto_route.py',
                  'devnet-opencode-auto-router-v0.2.4-QA-BLOCKED/test_qa_dispatch.py',
                  'devnet-opencode-auto-router-v0.2.4-QA-BLOCKED/test_session_recovery.py',
                  'devnet-opencode-auto-router-v0.2.4-QA-BLOCKED/test_v019_host_isolation.py',
                  'devnet-opencode-auto-router-v0.2.4-QA-BLOCKED/test_v020_review_schema.py',
                  'devnet-opencode-auto-router-v0.2.4-QA-BLOCKED/test_v021_tool_collision.py',
                  'devnet-opencode-auto-router-v0.2.4-QA-BLOCKED/test_v022_deterministic_tool_fallback.py',
                  'devnet-opencode-auto-router-v0.2.4-QA-BLOCKED/test_v023_master_handoff.py',
                  'devnet-opencode-auto-router-v0.2.4-QA-BLOCKED/test_v024_private_opencode.py',
                  'devnet-opencode-auto-router-v0.2.4-QA-BLOCKED/master_qa_bridge.py',
                  'devnet-opencode-auto-router-v0.2.4-QA-BLOCKED/.opencode/tools/devnet_router_regressions_v021.ts',
              }
              assert {x.filename for x in members} == expected_files, 'BLOCKED: unexpected ZIP contents'
              root = pathlib.Path(tmp).resolve()
              for item in members:
                  path = (root/item.filename).resolve()
                  assert path.is_relative_to(root) and not item.filename.startswith('/'), 'BLOCKED: ZIP traversal'
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(z.read(item))
              source = root/'devnet-opencode-auto-router-v0.2.4-QA-BLOCKED'
              assert hashlib.sha256((source/'baseline_v017.zip').read_bytes()).hexdigest() == '8a72d480d403c1ecab29a4348a500b9c713a93808f97be94facba270c75d41db', 'BLOCKED: pinned baseline changed'
              assert hashlib.sha256((source/'qa_live_recovery_v017.py').read_bytes()).hexdigest() == 'd020f62b9a86d0a3547f82dcdbc3a77d7182300ce3aaf838136acfdf0783b1ee', 'BLOCKED: pinned live runner changed'
              for f in source.glob('*.py'): compile(f.read_bytes(), str(f), 'exec')
              assert len(list(source.glob('*.py'))) == 15, 'BLOCKED: unexpected Python module count'
              master = pathlib.Path('qa/master/devnet-master-qa-unified-v0.3.8-QA-BLOCKED.zip').resolve()
              assert master.is_file() and hashlib.sha256(master.read_bytes()).hexdigest() == 'de83312d81636c8f92802060fc516188dc46b62b6d246bf6cc3d2361f0a1500c', 'BLOCKED: exact Master QA v0.3.8 dependency unavailable'
              env = {**os.environ, 'DEVNET_PINNED_MASTER_ZIP':str(master)}
              p = subprocess.run([sys.executable,'-m','unittest','discover','-s',str(source),'-p','test_*.py','-v'],cwd=source,check=False,env=env,capture_output=True,text=True,timeout=180)
              print(p.stdout[-12000:],flush=True)
              print(p.stderr[-20000:],flush=True)
              assert p.returncode == 0 and 'Ran 221 tests in' in p.stderr, 'BLOCKED: incomplete Master handoff regression suite'
              receipt = {
                  'schema':'devnet-github-stage-receipt-v1',
                  'stage':'github','scope':'router-v0.2.4-bundled-python-regressions',
                  'zip_path':str(file),'zip_sha256':expected,
                  'master_dependency_sha256':'de83312d81636c8f92802060fc516188dc46b62b6d246bf6cc3d2361f0a1500c',
                  'test_count':221,'status':'PASS','exit_code':p.returncode,
                  'source_commit_sha':os.environ['GITHUB_SHA'],
                  'github_run_id':os.environ['GITHUB_RUN_ID'],
                  'github_run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
                  'release_approved':False,'trusted_vm_or_host':False}
              pathlib.Path('qa-router-ci-receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\\n')
              print('GITHUB_ROUTER_TEST_EXIT='+str(p.returncode),flush=True)
              sys.exit(p.returncode)
          PY
      - name: Sign exact tested router ZIP provenance
        uses: actions/attest@v4
        with:
          subject-path: qa/router/devnet-opencode-auto-router-v0.2.4-QA-BLOCKED.zip
      - name: Sign exact GitHub test receipt
        uses: actions/attest@v4
        with:
          subject-path: qa-router-ci-receipt.json
      - name: Preserve GitHub test receipt
        uses: actions/upload-artifact@v4
        with:
          name: devnet-router-v024-github-stage-receipt
          path: qa-router-ci-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Report fail-closed scope
        if: always()
        run: echo 'GitHub Python regression only. Full Master QA, VM, host, live OpenCode/Ollama/GPU, install/rollback and acceptance remain BLOCKED.' >> "$GITHUB_STEP_SUMMARY"

  verify-router-provenance:
    needs: validate-router-candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: devnet-router-v024-github-stage-receipt
      - name: Verify independent GitHub signature and exact source commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify qa-router-ci-receipt.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/devnet-opencode-auto-router-qa.yml" --source-digest "$GITHUB_SHA"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('qa-router-ci-receipt.json').read_text())
          assert r['source_commit_sha']==os.environ['GITHUB_SHA'] and r['github_run_id']==os.environ['GITHUB_RUN_ID']
          assert r['stage']=='github' and r['test_count']==221 and r['status']=='PASS' and r['exit_code']==0
          assert r['release_approved'] is False and r['trusted_vm_or_host'] is False
          print('GITHUB_SIGNED_ROUTER_STAGE: VERIFIED_SCOPE_LIMITED')
          PY
