name: Devnet registered application GitHub stage (fail closed)
on:
  workflow_dispatch:
  push:
    branches: [qa/registered-app-executor-fix-v0.1.0]
    paths:
      - 'qa/application/jobs/**'
      - 'qa/application/registered_gate.py'
      - 'qa/application/candidate_checks.py'
      - '.github/workflows/devnet-application-qa.yml'
permissions:
  contents: read
jobs:
  application-github:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned cryptographic test dependency
        run: python -m pip install --disable-pip-version-check 'cryptography==50.0.2'
      - name: Validate fail-closed gate
        run: python3 -m unittest discover -s qa/application -p 'test_*.py' -v
      - name: Execute registered candidate GitHub checklist
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifests=(qa/application/jobs/*/manifest.json)
          if (( ${#manifests[@]} != 1 )); then
            echo 'BLOCKED: exactly one actual candidate must be registered' >&2
            exit 1
          fi
          python3 qa/application/registered_gate.py run "${manifests[0]}"
          python3 qa/application/registered_gate.py verify "${manifests[0]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registered-application-github-evidence
          path: qa-stage-evidence/
          if-no-files-found: ignore
          retention-days: 90
      - name: Preserve release block
        if: always()
        run: echo 'GitHub-only stage; VM, host and operator acceptance NOT verified. RELEASE BLOCKED.' >> "$GITHUB_STEP_SUMMARY"

  sign-candidate-evidence:
    needs: application-github
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: registered-application-github-evidence
          path: qa-stage-evidence
      - name: Recheck candidate and stage receipt before signing
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifests=(qa/application/jobs/*/manifest.json)
          test "${#manifests[@]}" -eq 1
          python3 qa/application/registered_gate.py verify "${manifests[0]}"
      - uses: actions/attest@v4
        with:
          subject-path: qa/application/jobs/*/candidate.zip
      - uses: actions/attest@v4
        with:
          subject-path: qa-stage-evidence/*/receipt.json
  independent-signature-check:
    needs: sign-candidate-evidence
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: registered-application-github-evidence
          path: qa-stage-evidence
      - name: Verify candidate-bound GitHub-issued signatures
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifests=(qa/application/jobs/*/manifest.json)
          test "${#manifests[@]}" -eq 1
          python3 qa/application/registered_gate.py verify "${manifests[0]}"
          zips=(qa/application/jobs/*/candidate.zip)
          receipts=(qa-stage-evidence/*/receipt.json)
          test "${#zips[@]}" -eq 1
          test "${#receipts[@]}" -eq 1
          gh attestation verify "${zips[0]}" --repo "${GITHUB_REPOSITORY}" --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/devnet-application-qa.yml" --source-digest "$GITHUB_SHA"
          gh attestation verify "${receipts[0]}" --repo "${GITHUB_REPOSITORY}" --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/devnet-application-qa.yml" --source-digest "$GITHUB_SHA"
          echo 'SIGNED_GITHUB_STAGE_VERIFIED. REAL VM/HOST/RELEASE STILL BLOCKED.' >> "$GITHUB_STEP_SUMMARY"
