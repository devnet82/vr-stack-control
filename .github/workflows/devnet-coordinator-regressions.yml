name: Devnet acceptance coordinator regression tests (not release approval)
on:
  push:
    branches:
      - qa/registered-app-executor-fix-v0.1.0
    paths:
      - 'qa/application/**'
      - '.github/workflows/devnet-coordinator-regressions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coordinator-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install isolated signature-test dependency
        run: python -m pip install --disable-pip-version-check 'cryptography==50.0.2'
      - name: Compile all QA coordinator Python
        run: python -m compileall -q qa/application
      - name: Exercise ALL coordinator positive and negative tests
        run: python -m unittest discover -s qa/application -p 'test_*.py' -v
      - name: Preserve correct scope
        if: always()
        run: echo 'Coordinator regressions only. No application has passed GitHub→VM→host. Release remains BLOCKED.' >> "$GITHUB_STEP_SUMMARY"
